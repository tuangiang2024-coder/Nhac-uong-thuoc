name: Tạo file cài đặt APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Tạo các file khung Android còn thiếu (không ghi đè file đã có).
      - run: flutter create --platforms=android --org vn.giadinh --project-name nhac_uong_thuoc .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nhac-uong-thuoc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
